<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #2d2d2d;
            color: #ccc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 15px;
            background-color: #252525;
            border-bottom: 1px solid #3d3d3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar-actions {
            display: flex;
            gap: 5px;
        }

        .sidebar-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .sidebar-btn:hover {
            background-color: #3d3d3d;
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .tree-item {
            padding: 6px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .tree-item:hover {
            background-color: #3d3d3d;
        }

        .tree-item.active {
            background-color: #094771;
            color: white;
        }

        .tree-item.folder {
            font-weight: 500;
        }

        .tree-item .icon {
            width: 16px;
            text-align: center;
        }

        .tree-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-item .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 2px 5px;
            font-size: 12px;
        }

        .tree-item:hover .delete-btn {
            opacity: 1;
        }

        .tree-item .delete-btn:hover {
            color: #ff6b6b;
        }

        .folder-children {
            padding-left: 15px;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .file-name {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background-color: #4a90d9;
            color: white;
        }

        .mode-btn:not(.active) {
            background-color: #e0e0e0;
            color: #666;
        }

        .mode-btn:hover:not(.active) {
            background-color: #d0d0d0;
        }

        .editor-container {
            flex: 1;
            background-color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex: 1;
            width: 100%;
            padding: 20px;
            border: none;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        #preview {
            flex: 1;
            padding: 20px;
            line-height: 1.8;
            display: none;
            overflow-y: auto;
        }

        #preview h1 { font-size: 2em; margin: 0.67em 0; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
        #preview h2 { font-size: 1.5em; margin: 0.75em 0; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
        #preview h3 { font-size: 1.25em; margin: 0.83em 0; }
        #preview h4 { font-size: 1em; margin: 1em 0; }
        #preview h5 { font-size: 0.875em; margin: 1.17em 0; }
        #preview h6 { font-size: 0.85em; margin: 1.33em 0; color: #666; }
        #preview p { margin: 1em 0; }
        #preview code { background-color: #f4f4f4; padding: 2px 6px; border-radius: 4px; font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace; font-size: 0.9em; }
        #preview pre { background-color: #f4f4f4; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 1em 0; }
        #preview pre code { padding: 0; background: none; }
        #preview blockquote { border-left: 4px solid #ddd; padding-left: 16px; margin: 1em 0; color: #666; }
        #preview ul, #preview ol { margin: 1em 0; padding-left: 2em; }
        #preview li { margin: 0.5em 0; }
        #preview a { color: #4a90d9; text-decoration: none; }
        #preview a:hover { text-decoration: underline; }
        #preview hr { border: none; border-top: 2px solid #eee; margin: 2em 0; }

        .hidden { display: none !important; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 300px;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn.primary {
            background-color: #4a90d9;
            color: white;
        }

        .modal-btn.secondary {
            background-color: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Files</h2>
            <div class="sidebar-actions">
                <button class="sidebar-btn" onclick="showModal('file')" title="New File">+File</button>
                <button class="sidebar-btn" onclick="showModal('folder')" title="New Folder">+Folder</button>
            </div>
        </div>
        <div class="file-tree" id="fileTree"></div>
    </div>

    <div class="main-content">
        <header>
            <span class="file-name" id="currentFileName">No file selected</span>
            <div class="mode-toggle">
                <button class="mode-btn active" id="editBtn" onclick="switchMode('edit')">Edit</button>
                <button class="mode-btn" id="previewBtn" onclick="switchMode('preview')">Preview</button>
            </div>
        </header>

        <div class="editor-container">
            <textarea id="editor" placeholder="Select a file or create a new one..."></textarea>
            <div id="preview"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">New File</h3>
            <input type="text" id="modalInput" placeholder="Enter name...">
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="hideModal()">Cancel</button>
                <button class="modal-btn primary" onclick="confirmModal()">Create</button>
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const editBtn = document.getElementById('editBtn');
        const previewBtn = document.getElementById('previewBtn');
        const fileTree = document.getElementById('fileTree');
        const currentFileNameEl = document.getElementById('currentFileName');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalInput = document.getElementById('modalInput');

        let fileSystem = {};
        let currentFile = null;
        let modalType = 'file';

        // Initialize
        function init() {
            loadFileSystem();
            if (Object.keys(fileSystem).length === 0) {
                fileSystem = {
                    'Welcome.md': {
                        type: 'file',
                        content: `# Welcome to Markdown Editor

This is a simple markdown editor with **edit** and **preview** modes.

## Features

- Write markdown in edit mode
- See rendered HTML in preview mode
- File management in sidebar

## Getting Started

1. Create a new file using the **+File** button
2. Create folders with **+Folder** button
3. Click on a file to edit it
4. Use Edit/Preview to toggle modes

Enjoy writing!`
                    }
                };
                saveFileSystem();
            }
            renderFileTree();
        }

        // File System Operations
        function loadFileSystem() {
            const saved = localStorage.getItem('markdownEditorFS');
            fileSystem = saved ? JSON.parse(saved) : {};
        }

        function saveFileSystem() {
            localStorage.setItem('markdownEditorFS', JSON.stringify(fileSystem));
        }

        function renderFileTree() {
            fileTree.innerHTML = '';
            renderItems(fileSystem, fileTree, '');
        }

        function renderItems(items, container, path) {
            const sortedKeys = Object.keys(items).sort((a, b) => {
                const aIsFolder = items[a].type === 'folder';
                const bIsFolder = items[b].type === 'folder';
                if (aIsFolder && !bIsFolder) return -1;
                if (!aIsFolder && bIsFolder) return 1;
                return a.localeCompare(b);
            });

            for (const name of sortedKeys) {
                const item = items[name];
                const fullPath = path ? `${path}/${name}` : name;
                const div = document.createElement('div');
                div.className = `tree-item ${item.type}${currentFile === fullPath ? ' active' : ''}`;
                div.innerHTML = `
                    <span class="icon">${item.type === 'folder' ? '&#128193;' : '&#128196;'}</span>
                    <span class="name">${name}</span>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteItem('${fullPath}')">&#10005;</button>
                `;

                if (item.type === 'file') {
                    div.onclick = () => openFile(fullPath);
                } else {
                    div.onclick = () => toggleFolder(div);
                }

                container.appendChild(div);

                if (item.type === 'folder' && item.children) {
                    const childContainer = document.createElement('div');
                    childContainer.className = 'folder-children';
                    container.appendChild(childContainer);
                    renderItems(item.children, childContainer, fullPath);
                }
            }
        }

        function toggleFolder(element) {
            const children = element.nextElementSibling;
            if (children && children.classList.contains('folder-children')) {
                children.style.display = children.style.display === 'none' ? 'block' : 'none';
            }
        }

        function getItem(path) {
            const parts = path.split('/');
            let current = fileSystem;
            for (let i = 0; i < parts.length - 1; i++) {
                if (current[parts[i]] && current[parts[i]].type === 'folder') {
                    current = current[parts[i]].children;
                } else {
                    return null;
                }
            }
            return { container: current, name: parts[parts.length - 1] };
        }

        function openFile(path) {
            if (currentFile) {
                const prev = getItem(currentFile);
                if (prev && prev.container[prev.name]) {
                    prev.container[prev.name].content = editor.value;
                    saveFileSystem();
                }
            }

            const item = getItem(path);
            if (item && item.container[item.name] && item.container[item.name].type === 'file') {
                currentFile = path;
                editor.value = item.container[item.name].content || '';
                currentFileNameEl.textContent = path;
                switchMode('edit');
                renderFileTree();
            }
        }

        function deleteItem(path) {
            if (!confirm(`Delete "${path}"?`)) return;

            const item = getItem(path);
            if (item) {
                delete item.container[item.name];
                saveFileSystem();
                if (currentFile === path) {
                    currentFile = null;
                    editor.value = '';
                    currentFileNameEl.textContent = 'No file selected';
                }
                renderFileTree();
            }
        }

        // Modal
        function showModal(type) {
            modalType = type;
            modalTitle.textContent = type === 'file' ? 'New File' : 'New Folder';
            modalInput.value = '';
            modalInput.placeholder = type === 'file' ? 'filename.md' : 'folder name';
            modal.classList.add('show');
            modalInput.focus();
        }

        function hideModal() {
            modal.classList.remove('show');
        }

        function confirmModal() {
            let name = modalInput.value.trim();
            if (!name) return;

            if (modalType === 'file' && !name.includes('.')) {
                name += '.md';
            }

            if (fileSystem[name]) {
                alert('Item already exists');
                return;
            }

            if (modalType === 'file') {
                fileSystem[name] = { type: 'file', content: '' };
                saveFileSystem();
                renderFileTree();
                openFile(name);
            } else {
                fileSystem[name] = { type: 'folder', children: {} };
                saveFileSystem();
                renderFileTree();
            }

            hideModal();
        }

        modalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmModal();
            if (e.key === 'Escape') hideModal();
        });

        // Auto-save
        editor.addEventListener('input', () => {
            if (currentFile) {
                const item = getItem(currentFile);
                if (item && item.container[item.name]) {
                    item.container[item.name].content = editor.value;
                    saveFileSystem();
                }
            }
        });

        // Mode switching
        function switchMode(mode) {
            if (mode === 'edit') {
                editor.classList.remove('hidden');
                preview.style.display = 'none';
                editBtn.classList.add('active');
                previewBtn.classList.remove('active');
            } else {
                editor.classList.add('hidden');
                preview.style.display = 'block';
                preview.innerHTML = parseMarkdown(editor.value);
                editBtn.classList.remove('active');
                previewBtn.classList.add('active');
            }
        }

        function parseMarkdown(text) {
            const lines = text.split('\n');
            const result = [];
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];

                if (line.startsWith('```')) {
                    const codeLines = [];
                    i++;
                    while (i < lines.length && !lines[i].startsWith('```')) {
                        codeLines.push(escapeHtml(lines[i]));
                        i++;
                    }
                    result.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
                    i++;
                    continue;
                }

                if (line.startsWith('- ')) {
                    const items = [];
                    while (i < lines.length && lines[i].startsWith('- ')) {
                        items.push('<li>' + formatLine(lines[i].substring(2)) + '</li>');
                        i++;
                    }
                    result.push('<ul>' + items.join('') + '</ul>');
                    continue;
                }

                if (/^\d+\. /.test(line)) {
                    const items = [];
                    while (i < lines.length && /^\d+\. /.test(lines[i])) {
                        items.push('<li>' + formatLine(lines[i].replace(/^\d+\. /, '')) + '</li>');
                        i++;
                    }
                    result.push('<ol>' + items.join('') + '</ol>');
                    continue;
                }

                if (line.startsWith('#')) {
                    const match = line.match(/^(#{1,6}) (.+)$/);
                    if (match) {
                        const level = match[1].length;
                        result.push('<h' + level + '>' + formatLine(match[2]) + '</h' + level + '>');
                        i++;
                        continue;
                    }
                }

                if (line === '---') {
                    result.push('<hr>');
                    i++;
                    continue;
                }

                if (line.startsWith('> ')) {
                    result.push('<blockquote>' + formatLine(line.substring(2)) + '</blockquote>');
                    i++;
                    continue;
                }

                if (line.trim() === '') {
                    result.push('');
                    i++;
                    continue;
                }

                result.push('<p>' + formatLine(line) + '</p>');
                i++;
            }

            return result.join('\n');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatLine(text) {
            text = escapeHtml(text);
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
            text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            return text;
        }

        init();
    </script>
</body>
</html>
